apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpplint
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dpplint
  template:
    metadata:
      labels:
        app: dpplint
    spec:
      containers:
      - name: dpplint
        image: oydeu/dpplint:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: LANG
          value: C.UTF-8
        - name: RAILS_ENV
          value: production
        - name: DIDLINT_URL
          value: https://didlint.ownyourdata.eu
        - name: RAILS_MAX_THREADS
          value: "16"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /version
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
