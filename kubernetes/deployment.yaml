apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpplint
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dpplint
  template:
    metadata:
      labels:
        app: dpplint
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: dpplint
      containers:
      - name: dpplint
        image: oydeu/dpplint@sha256:721ff836b23f36b8ed9541732d07f49e7ebeec988f46e20b2ef987ce99572e94
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: LANG
          value: C.UTF-8
        - name: RAILS_ENV
          value: production
        - name: DIDLINT_URL
          value: https://didlint.ownyourdata.eu
        - name: RAILS_MAX_THREADS
          value: "16"
        - name: NU_CHECKER_URL
          value: http://127.0.0.1:8888/
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      - name: nu-html-checker
        image: ghcr.io/validator/validator@sha256:8f21030474e68e06905cfa801b37376e99c0e37867c653c5b6cd7e2dcaf3f503
        imagePullPolicy: IfNotPresent
        env:
        - name: BIND_ADDRESS
          value: 127.0.0.1
        - name: JAVA_TOOL_OPTIONS
          value: -Xmx192m -Xss512k
        resources:
          requests:
            cpu: 50m
            memory: 320Mi
          limits:
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://127.0.0.1:8888/
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
