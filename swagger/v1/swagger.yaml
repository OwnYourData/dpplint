openapi: 3.0.1
info:
  title: DPP Linter API
  version: v1
  description: >-
    Checks the digital product passport data retrievable for a product
    identifier against the automated passport criteria of
    https://github.com/OwnYourData/dpp-criteria. Results report how many
    automated checks passed; they are no certification and establish no
    presumption of conformity.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
paths:
  /api/v1/validate/{productId}:
    get:
      summary: Retrieve the passport for a product identifier and check it
      parameters:
        - name: productId
          in: path
          required: true
          description: Product identifier as HTTPS URL, for example https://dpp.oydapp.eu/01/09520123456788/21/000001
          schema:
            type: string
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "422":
          description: The passport could not be retrieved
  /api/v1/validate:
    post:
      summary: Check a passport sent as JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "422":
          description: The body is not a JSON object
  /version:
    get:
      summary: Versions of dpplint, dpp-criteria and the SOyA web-cli
      description: >-
        soya-context says when the SOyA structures of the image were built and
        whether their SOyA context was fetched or taken from the cached copy of
        dpp-criteria, with its date.
      responses:
        "200":
          description: Version information
  /ready:
    get:
      summary: Whether this instance can check passports
      description: >-
        Used as readiness probe. Ready when the SOyA web-cli and the SOyA
        repository with the structures of the image answer. The result is
        held and renewed at most every 30 s (every second while not ready).
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready, with the reason
components:
  schemas:
    Report:
      type: object
      properties:
        productId:
          type: string
        retrieval:
          type: object
          nullable: true
          properties:
            productId: { type: string }
            url: { type: string }
            status: { type: integer }
            contentType: { type: string }
            httpVersion: { type: string, example: "2.0", description: HTTP version of the final response }
        summary:
          type: object
          description: Only criteria with status active count. passed and warning count as passed, skipped is not counted.
          properties:
            text: { type: string, example: "7 of 7 automated checks passed" }
            passed: { type: integer }
            failed: { type: integer }
            warnings: { type: integer }
            skipped: { type: integer }
            skipped_by_reason: { type: object, additionalProperties: { type: integer }, description: number of skipped criteria per reason_code (only codes that occur) }
            proposed_not_counted:
              type: object
              description: The same figures for criteria with status proposed, which are not counted.
              properties:
                text: { type: string }
                passed: { type: integer }
                failed: { type: integer }
                warnings: { type: integer }
                skipped: { type: integer }
                skipped_by_reason: { type: object, additionalProperties: { type: integer } }
        criteria:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: DPP-DAT-014 }
              title: { type: string }
              level: { type: string, enum: [MUST, SHOULD, MAY] }
              description_url: { type: string, format: uri, description: readable description of the criterion in criteria/README.md of the dpp-criteria commit used; absent if that commit has none }
              result: { type: string, enum: [passed, warning, failed, skipped] }
              status: { type: string, enum: [proposed, active] }
              counted: { type: boolean, description: true if the criterion counts in summary.text (status active) }
              reason: { type: string, description: why the criterion was skipped }
              reason_code: { type: string, enum: [not_applicable, not_implemented, no_evidence, needs_credentials, not_sent, unreachable, not_evaluated], description: "category of the skip, see Results in CRITERIA-FORMAT.md of dpp-criteria; only for result skipped" }
              messages:
                type: array
                items:
                  type: object
                  properties:
                    severity: { type: string, enum: [violation, warning, info] }
                    message: { type: string }
        notice:
          type: string
        notices:
          type: array
          description: >-
            Notes on how the check was run, for example that a SOyA structure was
            evaluated with a cached copy of its SOyA context because SOyA was not
            reachable when the image was built, or that the time limit of the
            check was reached. Empty if there is nothing to note.
          items: { type: string }
        timeLimit:
          type: object
          description: >-
            Time limit of the check (CHECK_DEADLINE). If it was reached, the
            criteria not evaluated in time are skipped with reason_code
            not_evaluated; the results reached before are kept.
          properties:
            seconds: { type: number, example: 35 }
            reached: { type: boolean }
        dpp-criteria:
          type: string
